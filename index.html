<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNARKBOT // AI Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0a1a;
    --bg-panel: #12122b;
    --violet: #7c5cff;
    --cyan: #4deaff;
    --magenta: #ff4dd8;
    --text-hi: #eef0ff;
    --text-lo: #8b8ba7;
    --glass: rgba(124, 92, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg-deep);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated mesh background */
  .mesh {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(124,92,255,0.25), transparent 40%),
      radial-gradient(circle at 80% 30%, rgba(77,234,255,0.18), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(255,77,216,0.15), transparent 45%);
    animation: drift 18s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes drift {
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(-3%, 2%) scale(1.08); }
  }

  .grid-overlay {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,92,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,92,255,0.05) 1px, transparent 1px);
    background-size: 38px 38px;
    z-index: 0;
    mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
  }

  .terminal {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    height: 92vh;
    max-height: 820px;
    background: rgba(18, 18, 43, 0.7);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(124, 92, 255, 0.25);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(124, 92, 255, 0.15), 0 20px 60px rgba(0,0,0,0.5);
  }

  .header {
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid rgba(124, 92, 255, 0.2);
    background: linear-gradient(180deg, rgba(124,92,255,0.08), transparent);
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: conic-gradient(from 180deg, var(--violet), var(--cyan), var(--magenta), var(--violet));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    animation: spin 6s linear infinite;
    position: relative;
  }
  .avatar::after {
    content: '😏';
    position: absolute;
    animation: counterspin 6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes counterspin { to { transform: rotate(-360deg); } }

  .header-info { flex: 1; }
  .header-name {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.5px;
    color: var(--text-hi);
    font-family: 'JetBrains Mono', monospace;
  }
  .header-status {
    font-size: 11px;
    color: var(--cyan);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }
  .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--violet); border-radius: 2px; }

  .row { display: flex; animation: rise 0.35s ease; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble {
    max-width: 80%;
    padding: 12px 15px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.5;
    position: relative;
  }
  .bubble.user {
    background: linear-gradient(135deg, var(--violet), #5a3fd6);
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 20px rgba(124,92,255,0.35);
  }
  .bubble.bot {
    background: var(--glass);
    border: 1px solid rgba(77,234,255,0.2);
    color: var(--text-hi);
    border-bottom-left-radius: 4px;
  }

  .typing-dots { display: inline-flex; gap: 4px; padding: 3px 0; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan);
    animation: blink 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  .input-bar {
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    border-top: 1px solid rgba(124, 92, 255, 0.2);
    background: rgba(10,10,26,0.4);
  }
  .input-bar input {
    flex: 1;
    border: 1px solid rgba(124,92,255,0.3);
    outline: none;
    background: rgba(255,255,255,0.03);
    color: var(--text-hi);
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14.5px;
    font-family: 'Space Grotesk', sans-serif;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-bar input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(77,234,255,0.15);
  }
  .input-bar input::placeholder { color: var(--text-lo); }

  .send-btn {
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    border: none;
    width: 46px;
    height: 46px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: white;
    font-size: 18px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(77,234,255,0.3);
  }
  .send-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(77,234,255,0.45); }
  .send-btn:active { transform: scale(0.94); }
</style>
</head>
<body>
<div class="mesh"></div>
<div class="grid-overlay"></div>

<div class="terminal">
  <div class="header">
    <div class="avatar"></div>
    <div class="header-info">
      <div class="header-name">SNARKBOT</div>
      <div class="header-status"><span class="pulse-dot"></span>ONLINE // UNFORTUNATELY</div>
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="row bot">
      <div class="bubble bot">oh good, someone new to disappoint. type something.</div>
    </div>
  </div>

  <div class="input-bar">
    <input type="text" id="msgInput" placeholder="say something..." autocomplete="off">
    <button class="send-btn" id="sendBtn">➤</button>
  </div>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

// Replace with your deployed Cloudflare Worker URL after deploying.
const BACKEND_URL = 'https://snarkbot-worker.YOUR-SUBDOMAIN.workers.dev';

let history = [];

function addBubble(text, who) {
  const row = document.createElement('div');
  row.className = `row ${who}`;
  const bubble = document.createElement('div');
  bubble.className = `bubble ${who}`;
  bubble.textContent = text;
  row.appendChild(bubble);
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'row bot';
  row.id = 'typingRow';
  row.innerHTML = '<div class="bubble bot"><div class="typing-dots"><span></span><span></span><span></span></div></div>';
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const row = document.getElementById('typingRow');
  if (row) row.remove();
}

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;

  addBubble(text, 'user');
  history.push({ role: 'user', content: text });
  msgInput.value = '';
  showTyping();

  try {
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    const data = await res.json();
    removeTyping();

    let reply = "static on the line. try again.";
    if (data && data.content) {
      const block = data.content.find(b => b.type === 'text');
      if (block) reply = block.text;
    }
    addBubble(reply, 'bot');
    history.push({ role: 'assistant', content: reply });
  } catch (err) {
    removeTyping();
    addBubble("can't reach the server. is the Worker deployed?", 'bot');
  }
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
